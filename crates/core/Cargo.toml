[package]
name = "forja-core"
version.workspace = true
edition.workspace = true
[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
reqwest.workspace = true
anyhow.workspace = true
sha2.workspace = true
chrono.workspace = true
futures-util.workspace = true
base64.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
url = "2"
similar = "2"
jsonschema = "0.29"
toml = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
portable-pty = "0.8"
regex = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
serde_yaml_ng = "0.10"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }
[dev-dependencies]
tempfile = "3"
