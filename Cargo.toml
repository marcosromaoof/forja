[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "apps/cli", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/daemon", "apps/cli"]
[workspace.package]
version = "0.1.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
anyhow = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
base64 = "0.22"
